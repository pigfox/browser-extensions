<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Summary — by Pigfox</title>
    <style>
      body { width: 380px; max-height: 580px; margin: 0; padding: 16px; font: 14px/1.45 system-ui, sans-serif; }
      h1 { font-size: 16px; margin: 0 0 12px; }
      h2 { font-size: 14px; margin: 16px 0 6px; }
      p { margin: 0 0 10px; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { display: flex; gap: 8px; align-items: baseline; margin: 0 0 6px; }
      button { font: inherit; cursor: pointer; }
      .timestamp { flex: none; padding: 1px 6px; border: 1px solid #c5c5c5; border-radius: 4px; background: #f4f4f4; font-variant-numeric: tabular-nums; }
      .saved { font-weight: 600; }
      .meta, .hint { color: #666; font-size: 12px; }
      footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 8px; border-top: 1px solid #e5e5e5; }
      .link-button { border: none; background: none; padding: 0; color: #1a5fb4; text-decoration: underline; }
    </style>
  </head>
  <body>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
